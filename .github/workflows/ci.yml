name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A new push on the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python + SQL + hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA, not a tag: a tag can be moved
      # to malicious code, a commit SHA cannot. The comment keeps it readable,
      # and Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml:
      # CI never silently resolves different versions than the developer.
      - name: Install dev dependencies
        run: uv sync --locked

      # Same command as `make lint` locally.
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The example values are fine here: the database lives only for the
      # duration of this job, on a throwaway runner.
      - name: Create .env from the example
        run: cp .env.example .env

      # Same docker-compose.yml as on a developer machine: CI tests the real
      # setup, init scripts included. --wait blocks until the healthchecks pass.
      - name: Start MariaDB and the PostgreSQL warehouse
        run: docker compose up -d --wait mariadb warehouse

      - name: Install dependencies
        run: uv sync --locked

      # Unit tests need no database; integration tests use the databases above.
      - name: Run all tests
        run: uv run --env-file .env pytest -v --durations=5

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs mariadb warehouse

  # The whole platform, as a user starts it: `docker compose up`, then the
  # first DAG run must succeed on its own. It runs every dbt model and every
  # dbt test on a month of data, through Airflow, in the real images.
  pipeline:
    name: End-to-end pipeline (docker compose + Airflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A month of history keeps the job short (the default is 90 days).
      SEED_DAYS: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build the pipeline image
        run: docker compose build airflow-scheduler

      # A DAG with a syntax error or a bad import is not "a failed run":
      # Airflow just does not show it. Catch it before starting anything.
      # --local parses the files in the image (the throwaway SQLite database
      # only exists because the command needs one).
      - name: Check that the DAG imports without error
        run: >-
          docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          rail-ticketing/pipeline:local
          bash -c "airflow db migrate > /dev/null && airflow dags list-import-errors --local"

      - name: Start the platform
        run: docker compose up -d --wait

      - name: Wait for the first DAG run to succeed
        run: .github/scripts/wait_for_first_dag_run.sh 900

      - name: Check that the marts are filled
        run: |
          tickets=$(docker compose exec -T warehouse psql -U warehouse_admin -d warehouse \
            -tAc "SELECT COUNT(*) FROM marts.fct_tickets")
          echo "fct_tickets: ${tickets} rows"
          test "${tickets}" -gt 0

      - name: Show the logs of every service on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A new push on the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python + SQL + hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml:
      # CI never silently resolves different versions than the developer.
      - name: Install dev dependencies
        run: uv sync --locked

      # Same command as `make lint` locally.
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

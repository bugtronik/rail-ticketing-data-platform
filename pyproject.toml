[project]
name = "rail-ticketing-data-platform"
version = "0.1.0"
description = "Batch ELT pipeline for a (synthetic) rail ticketing system: MariaDB OLTP -> PostgreSQL warehouse, dbt, Airflow."
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
]

# Command installed in the virtualenv: `rail-generator history|live`.
[project.scripts]
rail-generator = "rail_ticketing.generator.cli:main"
rail-extract = "rail_ticketing.extract.cli:main"

# Makes the project an installable package (code lives in src/rail_ticketing/).
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rail_ticketing"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "sqlfluff>=4.4.0",
]

# --- Ruff: Python linter + formatter -----------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names...
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs (mutable default args...)
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify
    "S",   # flake8-bandit: security, incl. hardcoded passwords (S105/S106)
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain `assert` statements (S101); tests use `random` (S311, see below).
"tests/**" = ["S101", "S311"]
# S311 warns that `random` is not cryptographically secure. Right in general,
# irrelevant for a simulation: the generator needs speed and reproducibility.
"src/rail_ticketing/generator/**" = ["S311"]

# --- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on typos in marker names instead of silently ignoring them.
addopts = "--strict-markers"
markers = [
	"integration: needs the MariaDB container running (docker compose up -d mariadb)",
]

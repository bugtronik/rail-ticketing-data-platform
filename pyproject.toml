[project]
name = "rail-ticketing-data-platform"
version = "0.1.0"
description = "Batch ELT pipeline for a (synthetic) rail ticketing system: MariaDB OLTP -> PostgreSQL warehouse, dbt, Airflow."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "sqlfluff>=4.4.0",
]

# --- Ruff: Python linter + formatter -----------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names...
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs (mutable default args...)
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify
    "S",   # flake8-bandit: security, incl. hardcoded passwords (S105/S106)
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain `assert` statements.
"tests/**" = ["S101"]

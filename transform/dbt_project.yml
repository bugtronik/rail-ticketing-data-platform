# dbt project: turns the raw copy of the source into a star schema for BI.
#   staging       one view per raw table: renamed, typed, local time; no business rule
#   intermediate  reusable business logic (is a ticket paid? how far does it go?)
#   marts         the star schema Power BI reads (tables)
name: rail_ticketing
version: "1.0.0"
profile: rail_ticketing

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # dbt sends anonymous usage events by default: off, nothing leaves the machine.
  send_anonymous_usage_stats: false

vars:
  # Times are stored in UTC; the business reads them in the network's local time.
  network_timezone: "Africa/Libreville"
  # Incremental models re-process the changes of the last hour again, in
  # case a load committed late (see models/marts/fct_tickets.sql).
  incremental_lookback: "1 hour"

models:
  rail_ticketing:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Fresh planner statistics as soon as a table is (re)built: the next
      # models that join it are planned with its real size (see ADR 0008).
      +post-hook: "ANALYZE {{ this }}"

snapshots:
  rail_ticketing:
    +post-hook: "ANALYZE {{ this }}"
